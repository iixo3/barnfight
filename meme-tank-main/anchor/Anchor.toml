[toolchain]

[features]
resolution = true
skip-lint = false


[registry]
url = "https://api.apr.dev"

[provider]
cluster = "mainnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[programs.localnet]
your_program = "PROGRAM_ID_REMOVED"

[test]
startup_wait = 0
